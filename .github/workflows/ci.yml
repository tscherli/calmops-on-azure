# CI: every push to main is checked, and a checked commit becomes an image in ACR.
#   test:  ruff + the full test suite (fake models, never calls Azure)
#   image: only if test passed. Logs in to Azure with OIDC (no stored password),
#          builds the image and pushes it as acrcalmopsts.azurecr.io/calmops:<commit SHA>.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button in the Actions tab

# Default for all jobs: the workflow may only read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Some tests open a Tk window (the desktop app). The runner has no screen,
      # so xvfb-run gives them a virtual one.
      - run: xvfb-run -a python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token, which Azure trusts
    env:
      # The commit SHA as tag: every commit gets a new tag, and no tag is reused.
      IMAGE: acrcalmopsts.azurecr.io/calmops:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      # IDs, not secrets: set in Settings > Secrets and variables > Actions > Variables.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Not `az acr build`: ACR Tasks are blocked in this subscription.
      - run: az acr login --name acrcalmopsts
      - run: docker build --tag "$IMAGE" .
      - run: docker push "$IMAGE"
